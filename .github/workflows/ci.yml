name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test --disable-sandbox
      - name: Update feed and signing tests
        run: python3 -m unittest discover -s Tests/Releases -v
      - name: Performance gate tests
        run: python3 -m unittest discover -s Tests/Performance -v
      - name: Universal release build
        env:
          UNIVERSAL: '1'
        run: zsh scripts/build-app.sh release
      - name: Verify bundle and architectures
        run: |
          codesign --verify --deep --strict dist/Watt.app
          architectures=$(lipo -archs dist/Watt.app/Contents/MacOS/Watt)
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
      - name: CPU and memory regression gate
        id: performance_gate
        run: python3 scripts/ci-performance.py
      - name: Profile failed UI performance check
        if: ${{ failure() && steps.performance_gate.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python3 scripts/profile-ui-performance.py
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/performance/
          if-no-files-found: warn
