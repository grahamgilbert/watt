    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#171b21"/><stop offset="1" stop-color="#101317"/></linearGradient>
    <linearGradient id="surface" x2="0.8" y2="1"><stop stop-color="#292f38"/><stop offset="1" stop-color="#1d222a"/></linearGradient>
    <linearGradient id="cpuArea" x2="0" y2="1"><stop stop-color="#90e5c2" stop-opacity=".24"/><stop offset="1" stop-color="#90e5c2" stop-opacity="0"/></linearGradient>
    <linearGradient id="networkArea" x2="0" y2="1"><stop stop-color="#8cb9f3" stop-opacity=".2"/><stop offset="1" stop-color="#8cb9f3" stop-opacity="0"/></linearGradient>
