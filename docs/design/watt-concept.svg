<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title desc">
  <title id="title">Watt — compact macOS performance instrument concept</title>
  <desc id="desc">Illustrative design board with a 48 by 18 point menu bar graphic at logical size and enlarged, a live popover, and a historical timeline. CPU, memory pressure, and directional network lanes remain fixed. Historical evidence says security activity overlapped a build; a scan delay is not established. All measurements are invented examples.</desc>
