  <text x="64" y="67" font-size="36" font-weight="600" letter-spacing="5">WATT</text>
  <text x="64" y="108" font-size="21" fill="#b9c3d0">A quiet instrument. A memory for your Mac.</text>
  <text x="1536" y="63" class="eyebrow" text-anchor="end">01 / DESIGN DIRECTION</text>
  <text x="1536" y="92" class="small" text-anchor="end">All data illustrative · proposed dimensions</text>

